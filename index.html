<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catmix 🐱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Catmix 🐱</h1>
    <div id="statusMessage" class="message"></div>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginBox">
        <input type="text" id="loginUsername" placeholder="اسم الدخول (إنجليزي)" dir="ltr">
        <input type="password" id="loginPassword" placeholder="كلمة السر" dir="ltr">
        <button onclick="loginUser()">دخول</button>
        <span class="toggle-link" onclick="toggleForms('register')">ما عندي حساب، أنشئ حساب</span>
    </div>

    <!-- شاشة إنشاء حساب -->
    <div id="registerBox" class="hidden">
        <input type="text" id="regDisplayName" placeholder="الاسم اللي يشوفه أصحابك">
        <input type="text" id="regUsername" placeholder="اسم الدخول (إنجليزي)" dir="ltr">
        <input type="password" id="regPassword" placeholder="كلمة السر" dir="ltr">
        <input type="password" id="regConfirmPassword" placeholder="أعد كتابة كلمة السر" dir="ltr">
        <button onclick="registerUser()">إنشاء الحساب</button>
        <span class="toggle-link" onclick="toggleForms('login')">عندي حساب، دخول</span>
    </div>

    <!-- الصفحة الرئيسية بعد تسجيل الدخول -->
    <div id="dashboardBox" class="hidden dashboard">
        <h2>أهلاً بك يا <span id="userDisplay" class="highlight"></span>!</h2>
        <p class="subtitle">تم تسجيل دخولك بنجاح في موقع Catmix.</p>
        <button class="logout-btn" onclick="logoutUser()">تسجيل الخروج</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
